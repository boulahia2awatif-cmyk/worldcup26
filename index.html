<style>
:root{--bg:#0a1628;--surface:#121f38;--card:#1a2d4a;--border:#243857;--gold:#f0b429;--live:#22c55e;--blue:#3b82f6;--text:#e8edf5;--muted:#8ca0bc;--safe-top:env(safe-area-inset-top,44px);--safe-bot:env(safe-area-inset-bottom,34px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto}
#sb{height:var(--safe-top);background:var(--bg);flex-shrink:0}
header{background:var(--bg);padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border)}
.hlogo{display:flex;align-items:center;gap:9px}
.badge{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),#e8960a);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.htext h1{font-size:13px;font-weight:900;line-height:1}
.htext p{font-size:9px;color:var(--muted);margin-top:1px}
.hright{display:flex;align-items:center;gap:6px}
.tzbadge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10px;color:var(--gold);font-weight:700}
#rbtn{width:30px;height:30px;background:var(--card);border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
#rbtn.spin{animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#srcbadge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700}
#srcbadge.live{background:rgba(34,197,94,.15);color:var(--live);border:1px solid rgba(34,197,94,.3)}
#srcbadge.cached{background:rgba(240,180,41,.1);color:var(--gold);border:1px solid rgba(240,180,41,.25)}
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-bot);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 7px;cursor:pointer;font-size:9px;color:var(--muted);font-weight:600;gap:2px}
.tab.on{color:var(--gold)}
.ti{font-size:19px;line-height:1}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{display:none;padding:14px}
.page.on{display:block}
#ib{display:none;background:linear-gradient(135deg,#1a3560,#0d2040);border:1px solid var(--gold);border-radius:14px;margin:0 14px 10px;padding:12px 14px}
#ib p{font-size:11px;color:var(--text);line-height:1.6}
#ib strong{color:var(--gold)}
#ibc{float:left;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}
.lpill{display:inline-flex;align-items:center;gap:5px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);border-radius:20px;padding:2px 9px;font-size:10px;color:var(--live);font-weight:700}
.ldot{width:6px;height:6px;background:var(--live);border-radius:50%;animation:pu 1s infinite;display:inline-block}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.hero{background:linear-gradient(145deg,#1a3560,#0f2040);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:'⚽';position:absolute;bottom:-8px;right:8px;font-size:72px;opacity:.05;transform:rotate(-15deg)}
.htop{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hstatus{font-size:10px;color:var(--muted)}
.mmain{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tside{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.fc{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.15);background:var(--card);display:flex;align-items:center;justify-content:center}
.fc img{width:100%;height:100%;object-fit:cover}
.tn{font-size:11px;font-weight:700;text-align:center;line-height:1.3}
.sbox{display:flex;align-items:center;gap:7px}
.sn{font-size:40px;font-weight:900;min-width:38px;text-align:center;line-height:1}
.ss{font-size:26px;color:var(--muted);font-weight:300}
.hfoot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:var(--muted)}
.stitle{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.mlist{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.mrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:9px}
.mrow.lr{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.04)}
.mtime{min-width:44px;text-align:center;font-size:11px;font-weight:700;color:var(--gold)}
.mtime.lt{color:var(--live)}
.mteams{flex:1;display:flex;flex-direction:column;gap:5px}
.mteam{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.fs{width:20px;height:20px;border-radius:50%;overflow:hidden;background:var(--surface);flex-shrink:0}
.fs img{width:100%;height:100%;object-fit:cover}
.mscores{display:flex;flex-direction:column;gap:5px;align-items:center}
.mscore{font-size:15px;font-weight:900;min-width:22px;text-align:center}
.mgr{font-size:9px;color:var(--muted);font-weight:700;background:var(--surface);border-radius:5px;padding:1px 5px;white-space:nowrap}
.gf{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.gf::-webkit-scrollbar{display:none}
.gfb{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer}
.gfb.on{background:var(--gold);border-color:var(--gold);color:#0a1628}
.sc{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.sh{background:linear-gradient(135deg,#1e3c6e,#162d52);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700}
.sgn{color:var(--gold)}
.scols{display:flex;gap:2px;color:var(--muted);font-size:9px}
.scols span{min-width:20px;text-align:center}
.srow{display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.04)}
.spos{font-size:10px;color:var(--muted);min-width:12px;text-align:center;font-weight:700}
.spos.q{color:var(--blue)}
.fxs{width:18px;height:18px;border-radius:50%;overflow:hidden;background:var(--surface);flex-shrink:0}
.fxs img{width:100%;height:100%;object-fit:cover}
.snm{flex:1;font-size:11px;font-weight:600}
.sts{display:flex;gap:2px}
.sts span{min-width:20px;text-align:center;font-size:11px;color:var(--muted)}
.pts{font-weight:900!important;color:var(--text)!important}
.dc{font-size:10px;color:var(--muted);font-weight:600;text-align:center;padding:3px 0 7px}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--border) 50%,var(--card) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:10px;margin-bottom:8px}
@keyframes shim{to{background-position:-200% 0}}
.tb{display:inline-block;background:rgba(240,180,41,.15);border:1px solid rgba(240,180,41,.3);border-radius:5px;padding:0 5px;font-size:9px;color:var(--gold);font-weight:700;margin-top:2px}
.stb{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:10px;text-align:center;color:var(--muted)}
.stb .em{font-size:36px}
.stb p{font-size:12px;line-height:1.6}
#lastup{font-size:9px;color:var(--muted);text-align:center;padding:4px 0 10px}

let matches = [], standings = {}, usingLive = false;

// ── LOAD DATA ────────────────────────────────────
async function loadData(manual=false){
  spin(true);
  if(!manual && matches.length) { spin(false); return; }
  try {
    const [mRes, sRes] = await Promise.all([
      fetch("https://api.football-data.org/v4/competitions/WC/matches", {headers:{"X-Auth-Token":TOKEN}}),
      fetch("https://api.football-data.org/v4/competitions/WC/standings", {headers:{"X-Auth-Token":TOKEN}})
    ]);
    if(!mRes.ok) throw new Error("API "+mRes.status);
    const mData = await mRes.json();
    const sData = await sRes.json();
    // Convert API format to our format
    matches = (mData.matches||[]).map(m=>({
      e: new Date(m.utcDate).getTime(),
      ar1: arName(m.homeTeam?.shortName||m.homeTeam?.name||"?"),
      ar2: arName(m.awayTeam?.shortName||m.awayTeam?.name||"?"),
      iso1: tlaToIso(m.homeTeam?.tla),
      iso2: tlaToIso(m.awayTeam?.tla),
      crest1: m.homeTeam?.crest,
      crest2: m.awayTeam?.crest,
      g: m.group?.replace("GROUP_","Group ") || "",
      r: roundAr(m.stage||""),
      s: m.score?.fullTime?.home!=null ? {ft:[m.score.fullTime.home,m.score.fullTime.away]} : null,
      live: ["IN_PLAY","PAUSED","HALFTIME"].includes(m.status),
      min: m.minute||"",
      done: m.status==="FINISHED",
      gnd: m.venue||"",
    }));
    // Parse standings
    standings = {};
    (sData.standings||[]).forEach(s=>{
      if(s.type==="TOTAL"){
        const g = s.group?.replace("GROUP_","Group ")||"";
        standings[g] = (s.table||[]).map(r=>({
          pos: r.position, name: arName(r.team?.shortName||r.team?.name||"?"),
          iso: tlaToIso(r.team?.tla), crest: r.team?.crest,
          mp:r.playedGames, gf:r.goalsFor, ga:r.goalsAgainst,
          gd:r.goalDifference, pts:r.points
        }));
      }
    });
    usingLive = true;
    setBadge(true);
    setLastUp("مباشر من API");
  } catch(e) {
    // Use fallback
    if(!matches.length){
      matches = FALLBACK.map(m=>({...m, live:false, done: m.s!=null, min:""}));
      // Compute standings from results
      computeStandings();
    }
    usingLive = false;
    setBadge(false);
    setLastUp("بيانات محلية (لا اتصال بـ API)");
  }
  renderAll();
  spin(false);
}

function setBadge(live){
  const b = document.getElementById("srcbadge");
  b.textContent = live ? "🟢 مباشر" : "📋 جدول";
  b.className = live ? "srcbadge live" : "srcbadge cached";
}

function setLastUp(msg){
  const t = new Date().toLocaleTimeString("fr-MA",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
  document.getElementById("lastup").textContent = msg + " · " + t;
}

// ── COMPUTE STANDINGS FROM FALLBACK ──────────────
function computeStandings(){
  standings = {};
  const groups = [...new Set(matches.map(m=>m.g).filter(Boolean))];
  groups.forEach(g=>{
    const pts={},mp={},gf={},ga={},names={},isos={},crests={};
    const init=t=>{if(!pts[t]){pts[t]=0;mp[t]=0;gf[t]=0;ga[t]=0;}};
    matches.filter(m=>m.g===g).forEach(m=>{
      init(m.ar1);init(m.ar2);
      names[m.ar1]=m.ar1;names[m.ar2]=m.ar2;
      isos[m.ar1]=m.iso1;isos[m.ar2]=m.iso2;
      if(m.s&&m.s.ft){
        const [h,a]=m.s.ft;
        mp[m.ar1]++;mp[m.ar2]++;
        gf[m.ar1]+=h;ga[m.ar1]+=a;
        gf[m.ar2]+=a;ga[m.ar2]+=h;
        if(h>a)pts[m.ar1]+=3;else if(h<a)pts[m.ar2]+=3;else{pts[m.ar1]++;pts[m.ar2]++;}
      }
    });
    const teams=Object.keys(pts).sort((a,b)=>{
      const dp=pts[b]-pts[a];if(dp)return dp;
      return(gf[b]-ga[b])-(gf[a]-ga[a]);
    });
    standings[g]=teams.map((t,i)=>({
      pos:i+1,name:t,iso:isos[t],crest:null,
      mp:mp[t],gf:gf[t],ga:ga[t],gd:gf[t]-ga[t],pts:pts[t]
    }));
  });
}

// ── TIME ─────────────────────────────────────────
function toMar(e,pat){
  if(!e) return "—";
  const d=new Date(e);
  if(pat==="time") return d.toLocaleTimeString("fr-MA",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
  if(pat==="date") return d.toLocaleDateString("ar-MA",{timeZone:TZ,month:"short",day:"numeric"});
  if(pat==="day")  return d.toLocaleDateString("ar-MA",{timeZone:TZ,weekday:"long",month:"short",day:"numeric"});
}
function isToday(e){
  if(!e)return false;
  const o={timeZone:TZ};
  return new Date().toLocaleDateString("en-US",o)===new Date(e).toLocaleDateString("en-US",o);
}

function flagImg(iso,crest,cls){
  const src = crest || (iso ? "https://flagcdn.com/w40/"+iso+".png" : "");
  if(!src) return "<div class='"+cls+"'></div>";
  return "<div class='"+cls+"'><img src='"+src+"' onerror=\"this.style.display='none'\"></div>";
}

// ── FEATURED ─────────────────────────────────────
function featured(){
  const live=matches.find(m=>m.live);
  if(live)return live;
  const now=Date.now();
  const next=matches.filter(m=>m.e>now&&!m.done).sort((a,b)=>a.e-b.e)[0];
  if(next)return next;
  return matches.filter(m=>m.done).sort((a,b)=>b.e-a.e)[0]||matches[0];
}

    "<div class='hero'>"+
    "<div class='htop'>"+
    (f.live?"<div class='lpill'><span class='ldot'></span> مباشر "+(f.min?f.min+"'":"")+"</div>":
             "<span class='hstatus'>"+(f.r||"")+" · "+(f.g||"")+"</span>")+
    "<span style='font-size:10px;color:var(--muted)'>"+date+"</span></div>"+
    "<div class='mmain'>"+
    "<div class='tside'>"+flagImg(f.iso1,f.crest1,"fc")+"<div class='tn'>"+f.ar1+"</div></div>"+
    "<div class='sbox'>"+
    (f.s||f.live?"<span class='sn'>"+hs+"</span><span class='ss'>-</span><span class='sn'>"+as+"</span>":
                 "<span style='font-size:20px;color:var(--gold);font-weight:900'>"+time+"</span>")+
    "</div>"+
    "<div class='tside'>"+flagImg(f.iso2,f.crest2,"fc")+"<div class='tn'>"+f.ar2+"</div></div>"+
    "</div>"+
    "<div class='hfoot'>🕐 "+time+" بتوقيت المغرب · "+date+"</div>"+
    "</div>";

  const now=Date.now();
  const liveM=matches.filter(m=>m.live);
  const todayD=matches.filter(m=>isToday(m.e)&&m.done);
  const todayU=matches.filter(m=>isToday(m.e)&&!m.done&&!m.live).sort((a,b)=>a.e-b.e);
  const fut=matches.filter(m=>m.e>now&&!isToday(m.e)&&!m.live).sort((a,b)=>a.e-b.e).slice(0,16);
  const shown=[...liveM,...todayD,...todayU,...fut];
  document.getElementById("cnt").textContent=
    (liveM.length+todayD.length+todayU.length)>0?(liveM.length+todayD.length+todayU.length)+" مباراة اليوم":"";
  document.getElementById("ulist").innerHTML=
    shown.length?"<div class='mlist'>"+shown.map(rowHTML).join("")+"</div>":
    "<div class='stb'><span class='em'>🗓</span><p>لا مباريات قريباً</p></div>";
}

// ── ROW ───────────────────────────────────────────
function rowHTML(m){
  const time=toMar(m.e,"time"),date=toMar(m.e,"date"),today=isToday(m.e);
  const hs=m.s?m.s.ft[0]:null,as=m.s?m.s.ft[1]:null;
  const grp=m.g?m.g.replace("Group ",""):"";
  return "<div class='mrow"+(m.live?" lr":"")+"'>"+
    "<div class='mtime"+(m.live?" lt":"")+"'>"+
    (m.live?"<span class='ldot'></span>"+(m.min?m.min+"'":"مباشر"):time)+
    (today&&!m.live?"<div class='tb'>اليوم</div>":"")+
    (!today&&!m.live?"<div style='font-size:9px;color:var(--muted);margin-top:1px'>"+date+"</div>":"")+
    "</div>"+
    "<div class='mteams'>"+
    "<div class='mteam'>"+flagImg(m.iso1,m.crest1,"fs")+"<span>"+m.ar1+"</span></div>"+
    "<div class='mteam'>"+flagImg(m.iso2,m.crest2,"fs")+"<span>"+m.ar2+"</span></div>"+
    "</div>"+
    (hs!==null?"<div class='mscores'><div class='mscore'>"+hs+"</div><div class='mscore'>"+as+"</div></div>":"")+
    "<div style='display:flex;flex-direction:column;align-items:flex-end;gap:3px'>"+
    (grp?"<div class='mgr'>"+grp+"</div>":"")+
    (m.done&&!m.live?"<div style='font-size:8px;color:var(--muted)'>ن</div>":"")+
    "</div></div>";
}

// ── GROUPS ────────────────────────────────────────
function renderGroups(){
  const grps=[...new Set(matches.map(m=>m.g).filter(Boolean))].sort();
  if(!grps.length){document.getElementById("gcontent").innerHTML="<div class='stb'><span class='em'>📊</span><p>جاري...</p></div>";return;}
  if(!grps.includes(AG))AG=grps[0];
  document.getElementById("gfilter").innerHTML=grps.map(g=>
    "<div class='gfb "+(g===AG?"on":"")+"' onclick=\"selG('"+g+"')\">"+g.replace("Group ","")+"</div>"
  ).join("");
  renderStandings();
}
function selG(g){AG=g;document.querySelectorAll("#gfilter .gfb").forEach(b=>b.classList.toggle("on",b.textContent===g.replace("Group ","")));renderStandings();}
function renderStandings(){
  const el=document.getElementById("gcontent");
  const table=standings[AG]||[];
  const upcoming=matches.filter(m=>m.g===AG&&m.e>Date.now()&&!m.done&&!m.live).sort((a,b)=>a.e-b.e).slice(0,4);
  el.innerHTML=
    "<div class='sc'><div class='sh'><span class='sgn'>المجموعة "+AG.replace("Group ","")+"</span>"+
    "<div class='scols'><span>لع</span><span>ف</span><span>ض</span><span>فر</span><span>ن</span></div></div>"+
    table.map((r,i)=>{
      const gd=r.gd>=0?"+"+r.gd:r.gd;
      return "<div class='srow'>"+
        "<span class='spos "+(i<2?"q":"")+"'>"+r.pos+"</span>"+
        flagImg(r.iso,r.crest,"fxs")+
        "<span class='snm'>"+r.name+"</span>"+
        "<div class='sts'><span>"+r.mp+"</span><span>"+r.gf+"</span><span>"+r.ga+"</span><span>"+gd+"</span><span class='pts'>"+r.pts+"</span></div>"+
        "</div>";
    }).join("")+"</div>"+
    (upcoming.length?"<div class='stitle' style='margin-top:14px'>مباريات قادمة</div><div class='mlist'>"+upcoming.map(rowHTML).join("")+"</div>":"");
}

// ── SCHEDULE ─────────────────────────────────────
function renderSched(){
  const grps=["ALL",...new Set(matches.filter(m=>m.g).map(m=>m.g))].sort((a,b)=>a==="ALL"?-1:b==="ALL"?1:a.localeCompare(b));
  document.getElementById("sfilter").innerHTML=grps.map(g=>
    "<div class='gfb "+(g===SG?"on":"")+"' onclick=\"selS('"+g+"')\">"+( g==="ALL"?"الكل":g.replace("Group ",""))+"</div>"
  ).join("");
  renderSchedList();
}
function selS(g){SG=g;document.querySelectorAll("#sfilter .gfb").forEach(b=>b.classList.toggle("on",(g==="ALL"&&b.textContent==="الكل")||b.textContent===g.replace("Group ","")));renderSchedList();}
function renderSchedList(){
  let ms=[...matches].sort((a,b)=>a.e-b.e);
  if(SG!=="ALL")ms=ms.filter(m=>m.g===SG);
  if(!ms.length){document.getElementById("slist").innerHTML="<div class='stb'><span class='em'>📅</span><p>لا مباريات</p></div>";return;}
  const byDate={};
  ms.forEach(m=>{const k=toMar(m.e,"day");if(!byDate[k])byDate[k]=[];byDate[k].push(m);});
  document.getElementById("slist").innerHTML=
    "<div class='mlist'>"+Object.entries(byDate).map(([d,gs])=>"<div class='dc'>"+d+"</div>"+gs.map(rowHTML).join("")).join("")+"</div>";
}

// ── TABS ─────────────────────────────────────────
function sw(p){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===p));
  document.querySelectorAll(".page").forEach(pg=>pg.classList.toggle("on",pg.id==="p-"+p));
  document.getElementById("content").scrollTop=0;
  if(p==="groups")renderGroups();
  if(p==="sched")renderSched();
}

// ── INSTALL ──────────────────────────────────────
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone)
  document.getElementById("ib").style.display="block";

// ── INIT ─────────────────────────────────────────
loadData(true);
setInterval(()=>loadData(true),60000);
</script>
</body>
</html>
